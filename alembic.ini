; Alembic configuration for Historiador.
;
; `script_location` points inside the package so migrations ship with the wheel;
; `prepend_sys_path = src` lets env.py import `historiador.data.models` when Alembic
; is invoked from a checkout that has not been installed.
;
; The URL here is only a fallback: env.py prefers $HISTORIADOR_DB_URL, so tests and
; the daemon can point the same migrations at a temp file without editing this file.

[alembic]
script_location = src/historiador/data/migrations
prepend_sys_path = src
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

sqlalchemy.url = sqlite+aiosqlite:///./historiador.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
