services:
  historian:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - historian-data:/home/historian/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/auth/config')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "8081:8081"
    volumes:
      - historian-data:/home/historian/data
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      historian:
        condition: service_healthy

volumes:
  historian-data:
    driver: local